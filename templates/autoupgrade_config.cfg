# ==============================================================================
# Oracle AutoUpgrade 19c / 23ai Configuration File
# Purpose: Automated, standardized database upgrade with rollback protection
# ==============================================================================

# Global Configurations
global.autoupg_log_dir=/u01/app/oracle/cfgtoollogs/autoupgrade

# Target Database 1 Configurations
upg1.sid=PRODDB
upg1.source_home=/u01/app/oracle/product/11.2.0/dbhome_1
upg1.target_home=/u01/app/oracle/product/19.0.0/dbhome_1
upg1.target_version=19
upg1.start_time=IMMEDIATE

# Safety & Performance Controls
upg1.restoration=YES
upg1.run_utlrp=YES
upg1.timezone_upg=YES
upg1.compile_invalid_objects=YES
upg1.log_dir=/u01/app/oracle/cfgtoollogs/autoupgrade/PRODDB

# Post-Upgrade Script Execution (Optional)
# upg1.postupgrade_script=/u01/scripts/post_upgrade_tasks.sql
